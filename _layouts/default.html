<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<nav class="top" aria-label="Main">
  <div class="top-in">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.names }}</a>
    <div class="links">
      <a href="{{ '/our-story/' | relative_url }}"{% if page.nav == 'story' %} aria-current="page"{% endif %}>Our story</a>
      <a href="{{ '/stories/' | relative_url }}"{% if page.nav == 'stories' or page.collection == 'stories' %} aria-current="page"{% endif %}>Stories</a>
      <a href="{{ '/photos/' | relative_url }}"{% if page.nav == 'photos' %} aria-current="page"{% endif %}>Photos</a>
    </div>
  </div>
</nav>
<main>
{{ content }}
</main>
<footer>
  <div class="foot-names">{{ site.names }}</div>
  <p>{{ site.tagline }}</p>
</footer>
<script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
