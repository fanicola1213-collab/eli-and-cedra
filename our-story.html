<section class="band">
  <div class="wrap narrow">
    <h1 class="page-title">Our story</h1>
    <p class="lead center">The moments that brought us here.</p>
    <ol class="timeline">
      {% for m in site.data.timeline %}
      <li>
        <span class="when">{{ m.when }}</span>
        <div><h3>{{ m.title }}</h3><p>{{ m.text }}</p></div>
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
